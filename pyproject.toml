[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]
ignore = [
    "B008",   # FastAPI 依赖注入要求在参数默认值里调用 Query()/Depends()
    "BLE001", # /health 需要兜住所有数据库异常并降级成可读状态
    "RUF001", # 中文全角标点在注释与文案里是刻意写法
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E402"]
